<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Symphony Glass — Tablero de identidad visual</title>

<!-- Tokens: fuente única. Se inyectan como CSS y se muestran en el artboard "Tokens CSS". -->
<script type="text/plain" id="tokens">
.th-dark{
  --bg:#1c1c1e; --glass:rgba(255,255,255,.065); --glass-strong:rgba(70,70,74,.46); --glass2:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.14); --hover:rgba(255,255,255,.07); --inset:rgba(0,0,0,.22);
  --text:#f4f4f5; --muted:#a6a6ac; --dot-off:#5b5b61;
  --accent:#3b82ff; --primary:#2f6df0; --primary-d:#2457cf; --teal:#8fb6ff; --focus:rgba(86,140,255,.32);
  --ok:#3ddc97; --bad:#ff6b6b; --warn:#ffb84d; --bad-text:#ff8a8a;
  --edge:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.04);
  --panel-shadow:0 28px 70px rgba(0,0,0,.45);
  --blur:blur(30px) saturate(150%);
  --orb1:#6b6b70; --orb1-op:.22; --orb2:#3d3d42; --orb2-op:.35;
  --arc:rgba(255,255,255,.22); --arc-fill:radial-gradient(circle at 30% 30%,rgba(255,255,255,.06),rgba(0,0,0,.28) 70%);
  --sheen:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.10) 50%,rgba(255,255,255,0) 70%);
  --overlay:rgba(10,10,12,.55);
  --p-blue-bg:rgba(86,140,255,.20); --p-blue:#a9c6ff;
  --p-violet-bg:rgba(160,150,255,.18); --p-violet:#c4bdff;
  --p-green-bg:rgba(61,220,132,.15); --p-green:#5fe39a;
  --p-amber-bg:rgba(255,184,77,.16); --p-amber:#ffc870;
  --p-slate-bg:rgba(150,150,160,.18); --p-slate:#c2c2c9;
  --p-bad-bg:rgba(255,92,92,.16); --p-bad:#ff8a8a;
  color-scheme:dark;
}
.th-light{
  --bg:#e4e4e8; --glass:rgba(255,255,255,.5); --glass-strong:rgba(255,255,255,.7); --glass2:rgba(255,255,255,.62);
  --line:rgba(30,30,40,.13); --hover:rgba(30,30,40,.06); --inset:rgba(30,30,40,.06);
  --text:#1b1b1f; --muted:#5f5f68; --dot-off:#a9a9b1;
  --accent:#2f6df0; --primary:#2f6df0; --primary-d:#2457cf; --teal:#2457cf; --focus:rgba(47,109,240,.25);
  --ok:#12804f; --bad:#c62828; --warn:#a35a00; --bad-text:#b02020;
  --edge:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.35);
  --panel-shadow:0 22px 55px rgba(30,30,50,.16);
  --blur:blur(30px) saturate(150%);
  --orb1:#b5b5bd; --orb1-op:.4; --orb2:#c9c9d0; --orb2-op:.5;
  --arc:rgba(30,30,40,.18); --arc-fill:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),rgba(30,30,40,.06) 70%);
  --sheen:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 70%);
  --overlay:rgba(225,225,232,.55);
  --p-blue-bg:rgba(47,109,240,.13); --p-blue:#2457cf;
  --p-violet-bg:rgba(80,100,220,.13); --p-violet:#3d4fc4;
  --p-green-bg:rgba(18,128,79,.14); --p-green:#0f6b42;
  --p-amber-bg:rgba(255,160,0,.20); --p-amber:#8a5200;
  --p-slate-bg:rgba(60,60,80,.12); --p-slate:#44444f;
  --p-bad-bg:rgba(198,40,40,.12); --p-bad:#b02020;
  color-scheme:light;
}
</script>

<style>
:root{
  /* Marca (logo Symphony) y espaciado: no cambian con el tema */
  --brand-navy:#0f4c6b; --brand-teal:#1f9e9a; --brand-red:#c8432f;
  --r-sm:12px; --r-md:20px; --r-lg:24px; --r-xl:32px; --r-full:999px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0d0f;font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}

/* ---------- Motor del tablero ---------- */
#vp{position:fixed;inset:0;cursor:grab;touch-action:none;background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1.2px);background-size:24px 24px;user-select:none}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.ab-wrap{position:absolute}
.ab-title{position:absolute;left:2px;bottom:100%;margin-bottom:10px;white-space:nowrap;color:#9a9aa3;font-size:15px;font-weight:600;letter-spacing:.01em}
.ab-title small{font-weight:500;color:#64646c;margin-left:10px}
.ab{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:var(--bg);color:var(--text);border-radius:20px;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 40px 90px rgba(0,0,0,.5)}

/* ===== Componentes de FONDO (independientes; fieles al original) =====
   .bgc            base: color --bg, recorta y aísla las capas
   .bgc-app        fondo de la app: 2 arcos circulares con borde fino (.shell::before/::after)
   .bgc-splash     fondo de inicio: 2 orbes grises desenfocados (.startupScreen::before/::after)
   .bgc-flat       solo color de fondo, sin decoración
   Tamaños en % del contenedor: escalan a cualquier pantalla (referencia 1440×900). */
.bgc{position:relative;overflow:hidden;isolation:isolate;background:var(--bg)}
.bgc::before,.bgc::after{content:"";position:absolute;border-radius:50%;z-index:-1;pointer-events:none}
.bgc-app::before{width:68%;aspect-ratio:1;left:-29%;top:-33%;background:var(--arc-fill);border:1.5px solid var(--arc)}
.bgc-app::after{width:76%;aspect-ratio:1;right:-36%;bottom:-71%;background:var(--arc-fill);border:1.5px solid var(--arc)}
.bgc-splash::before{width:39%;aspect-ratio:1;left:-8%;top:-16%;background:var(--orb1);opacity:var(--orb1-op);filter:blur(90px)}
.bgc-splash::after{width:35%;aspect-ratio:1;right:-7%;bottom:-18%;background:var(--orb2);opacity:var(--orb2-op);filter:blur(90px)}
.bgc-flat::before,.bgc-flat::after{display:none}
/* El fondo es una CAPA independiente detrás del contenido de cada artboard */
.bg-piece{position:absolute;inset:0;z-index:0}
.ab-content{position:absolute;inset:0;z-index:1}
#world.nobg .bg-piece{display:none}
#world.nobg .ab{background:transparent}

#index{position:fixed;left:16px;top:16px;bottom:16px;width:236px;z-index:50;display:flex;flex-direction:column;border-radius:22px;background:rgba(28,28,31,.78);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#e8e8ec;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#index header{padding:18px 18px 12px}
#index header b{display:block;font-size:15px;letter-spacing:.01em}
#index header span{display:block;margin-top:3px;font-size:12px;color:#8e8e96;line-height:1.4}
#index nav{flex:1;overflow:auto;padding:4px 10px 12px}
#index h6{margin:12px 10px 6px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6d6d75}
#index a{display:block;padding:8px 10px;border-radius:10px;color:#c9c9d0;font-size:13.5px;text-decoration:none;cursor:pointer}
#index a:hover{background:rgba(255,255,255,.07);color:#fff}
#index a.on{background:rgba(59,130,255,.22);color:#fff}
#hint{padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;line-height:1.55;color:#85858d}
#hint kbd{font:inherit;font-weight:700;color:#bdbdc5}
#zoom{position:fixed;left:50%;bottom:18px;transform:translateX(calc(-50% + 126px));z-index:50;display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;background:rgba(28,28,31,.82);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
#zoom button{height:34px;min-width:34px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:#d6d6dc;cursor:pointer;font-size:13px;font-weight:600}
#zoom button:hover{background:rgba(255,255,255,.1)}
#zoom #zl{min-width:58px;text-align:center;color:#fff}
#toast{position:fixed;right:20px;bottom:20px;z-index:60;padding:10px 16px;border-radius:12px;background:#f4f4f5;color:#1b1b1f;font-size:13px;font-weight:600;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:none}
[data-copy]{cursor:copy}

/* ---------- Sistema (réplica del CSS de la app) ---------- */
.ab h1,.ab h2,.ab h3,.ab h4,.ab p{margin:0}
.pad{padding:56px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--teal)}
.t-display{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.t-page{font-size:24px;font-weight:700;letter-spacing:-.01em}
.t-head{font-size:20px;font-weight:700;letter-spacing:-.01em}
.t-lg{font-size:15px;font-weight:500}
.t-body{font-size:14px}
.t-cap{font-size:13px;font-weight:500;color:var(--muted)}
.t-label{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:var(--edge),var(--panel-shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.glass-strong{background:var(--glass-strong);border:1px solid var(--line);box-shadow:var(--edge),var(--panel-shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.glass2{background:var(--glass2);border:1px solid var(--line);box-shadow:var(--edge);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.v-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;color:var(--text);transition:transform .12s,background .15s}
.v-btn:active{transform:scale(.97)}
.v-btn.dis{opacity:.5;cursor:not-allowed}
.v-btn-primary{background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 82%,#fff),var(--primary));color:#fff;border-color:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 22px color-mix(in srgb,var(--primary) 40%,transparent)}
.v-btn-primary:hover:not(.dis){background:var(--primary-d)}
.v-btn-ghost{background:var(--glass2);border-color:var(--line);box-shadow:var(--edge)}
.v-btn-ghost:hover{background:var(--hover)}
.v-btn-danger{background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad-text)}
.v-pill{display:inline-block;padding:4px 14px;border-radius:999px;font-size:12.5px;font-weight:600}
.tone-blue{background:var(--p-blue-bg);color:var(--p-blue)}.tone-violet{background:var(--p-violet-bg);color:var(--p-violet)}
.tone-green{background:var(--p-green-bg);color:var(--p-green)}.tone-amber{background:var(--p-amber-bg);color:var(--p-amber)}
.tone-slate{background:var(--p-slate-bg);color:var(--p-slate)}.tone-bad{background:var(--p-bad-bg);color:var(--p-bad)}
.v-field{display:flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:999px;color:var(--muted);font-size:15px;background:var(--glass2);border:1px solid var(--line);box-shadow:var(--edge)}
.v-field.focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--focus)}
.v-field input{flex:1;border:0;outline:0;background:transparent;color:var(--text);min-width:0;height:100%;font-size:15px}
.v-field input::placeholder{color:var(--muted)}
.v-icon{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;color:var(--teal);background:var(--glass2);border:1px solid var(--line);box-shadow:var(--edge)}
.v-icon.hov{background:var(--primary);border-color:rgba(255,255,255,.25);color:#fff}
.v-rec-busy{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.v-rec-done{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.v-rec-failed{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:color-mix(in srgb,var(--bad) 28%,transparent)}
.v-alert{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad-text);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-radius:20px;padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.v-ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--p-green);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);border-radius:20px;padding:12px 16px;font-size:14px;display:flex;gap:10px}
.seg{display:inline-flex;padding:4px;gap:4px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);box-shadow:var(--edge)}
.seg span{height:40px;min-width:92px;padding:0 20px;border-radius:999px;display:grid;place-items:center;color:var(--muted);font-size:15px;font-weight:600}
.seg span.on{background:var(--primary);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.tog{width:46px;height:26px;border-radius:13px;background:var(--glass2);border:1px solid var(--line);position:relative;display:inline-block}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted)}
.tog.on{background:var(--primary);border-color:rgba(255,255,255,.4)}.tog.on::after{left:auto;right:3px;background:#fff}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dot-off);display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.bad{background:var(--bad)}
.nav-i{display:flex;align-items:center;gap:14px;height:48px;padding:0 14px;border-radius:999px;color:var(--muted);font-size:15px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.nav-i.on{color:var(--text);font-weight:600;background:var(--glass2);background-image:var(--sheen);border-color:var(--line);box-shadow:var(--edge)}
.nav-i .bdg{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.brand{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:999px}
.brand .ava{width:56px;height:56px;border-radius:50%;background:var(--glass2);display:grid;place-items:center;flex:none}
.brand img{width:42px;height:42px;object-fit:contain}
.th-dark .brand img,.th-dark .logo-halo{filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff)}
.brand b{display:block;font-size:17px;letter-spacing:.06em}.brand span{display:block;font-size:11px;letter-spacing:.16em;color:var(--muted)}
table.v-table{width:100%;border-collapse:collapse;font-size:14px}
.v-table thead th{text-align:left;font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted);padding:16px 24px;background:var(--glass-strong);border-bottom:1px solid var(--line)}
.v-table td{padding:13px 24px;border-bottom:1px solid var(--line);vertical-align:middle}
.v-table tbody tr:last-child td{border-bottom:0}
.v-table tbody tr.hl{background:var(--glass2);background-image:var(--sheen)}
.v-table .strong{font-weight:600}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.col{display:flex;flex-direction:column}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* utilidades de artboard */
.sw{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.sw i{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);flex:none;display:block}
.sw b{display:block;font-size:13.5px;font-weight:600}.sw small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.grid{display:grid;gap:12px}
.sec-h{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card-note{padding:22px 24px;border-radius:var(--r-lg)}
.dd li{margin:7px 0;line-height:1.5;font-size:14px}
pre.code{margin:0;padding:20px 22px;border-radius:22px;background:var(--inset);border:1px solid var(--line);font-size:12px;line-height:1.55;overflow:hidden;white-space:pre;color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.spec-card{border-radius:var(--r-xl);padding:28px}
.spin{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--focus);border-top-color:var(--teal);border-right-color:var(--primary);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="vp"><div id="world"></div></div>

<aside id="index">
  <header><b>Symphony Glass</b><span>Tablero de identidad visual para las próximas apps</span></header>
  <nav id="nav"></nav>
  <div id="hint"><kbd>Arrastra</kbd> para mover · <kbd>⌘/Ctrl + rueda</kbd> o pellizco para zoom · <kbd>0</kbd> ver todo · <kbd>1</kbd> 100% · clic en un token para copiarlo</div>
</aside>
<div id="zoom"><button id="zo">−</button><button id="zl">100%</button><button id="zi">+</button><button id="zf">Ver todo</button><button id="zb" title="Oculta la capa de fondo de todos los artboards">Fondos: sí</button></div>
<div id="toast"></div>

<script>
/* ================= Tokens → <style> ================= */
const TOKENS = document.getElementById('tokens').textContent;
const st = document.createElement('style'); st.textContent = TOKENS; document.head.appendChild(st);

/* ================= Iconos ================= */
const IC = {
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', disc:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', warn:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5h.01"/>',
  burn:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 2 1 1 0-2-1-4 2-7z"/>', study:'<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 10h16"/>',
  dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>', sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>', play:'<path d="M7 5l12 7-12 7z"/>', info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/>'
};
const ic = (n,s=20)=>`<svg class="i" style="width:${s}px;height:${s}px" viewBox="0 0 24 24">${IC[n]}</svg>`;

/* ================= Piezas reutilizables ================= */
const brandPill = (w='264px')=>`<div class="brand glass-strong" style="width:${w}"><div class="ava"><img src="assets/logo.png" alt=""></div><div><b>SYMPHONY</b><span>MEDIA EXPORT</span></div></div>`;
const sw = (name,cssVar,extra='')=>`<div class="sw" data-copy="${cssVar}"><i style="background:${extra||`var(${cssVar})`}"></i><div><b>${name}</b><small class="hexv" data-v="${cssVar}">${cssVar}</small></div></div>`;
const pills = `<span class="v-pill tone-blue">Anonimizado</span><span class="v-pill tone-violet">CT</span><span class="v-pill tone-green">Grabado</span><span class="v-pill tone-amber">En cola</span><span class="v-pill tone-slate">Archivo</span><span class="v-pill tone-bad">Error</span>`;

/* ================= Artboards ================= */
const AB = [];
const add = (o)=>AB.push(o);

/* --- 1. Portada --- */
add({id:'portada',g:'Marca',t:'Portada',x:0,y:0,w:1400,h:760,th:'dark',html:()=>`
 <div class="pad" style="display:grid;grid-template-columns:1.1fr .9fr;gap:48px;height:100%;align-items:center">
  <div>
   <div class="eyebrow">Guía de identidad · v2.0</div>
   <h1 style="font-size:68px;line-height:1.02;letter-spacing:-.025em;margin:18px 0 20px">Symphony<br>Glass</h1>

const BGCSS = `/* Componentes de fondo: aplica la clase al contenedor raíz de la pantalla */
.bgc{position:relative;overflow:hidden;isolation:isolate;background:var(--bg)}
.bgc::before,.bgc::after{content:"";position:absolute;border-radius:50%;z-index:-1;pointer-events:none}
/* .bgc-app: app principal — 2 arcos con borde fino */
.bgc-app::before{width:68%;aspect-ratio:1;left:-29%;top:-33%;background:var(--arc-fill);border:1.5px solid var(--arc)}
.bgc-app::after{width:76%;aspect-ratio:1;right:-36%;bottom:-71%;background:var(--arc-fill);border:1.5px solid var(--arc)}
/* .bgc-splash: pantalla de inicio — 2 orbes grises desenfocados */
.bgc-splash::before{width:39%;aspect-ratio:1;left:-8%;top:-16%;background:var(--orb1);opacity:var(--orb1-op);filter:blur(90px)}
.bgc-splash::after{width:35%;aspect-ratio:1;right:-7%;bottom:-18%;background:var(--orb2);opacity:var(--orb2-op);filter:blur(90px)}
/* .bgc-flat: solo color */
.bgc-flat::before,.bgc-flat::after{display:none}`;
const bgTile = (kind,th)=>`<div class="bgc bgc-${kind} th-${th}" style="height:250px;border-radius:24px;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center"><div class="glass" style="width:62%;border-radius:var(--r-lg);padding:20px 22px"><b style="font-size:15px">Panel glass</b><p class="t-cap" style="margin-top:4px">sobre fondo ${kind}</p></div></div>`;

<script>
/* ================= Render ================= */
const world = document.getElementById('world'), vp = document.getElementById('vp');
AB.forEach(a=>{
  const w = document.createElement('div'); w.className='ab-wrap'; w.id='ab-'+a.id; w.style.cssText=`left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px`;
  w.innerHTML = `<div class="ab-title">${a.t}<small>${a.w}×${a.h} · ${a.th==='dark'?'oscuro':'claro'}</small></div><div class="ab th-${a.th}"><div class="bg-piece bgc bgc-${a.bg||'app'}" data-piece="Fondo ${a.bg||'app'}"></div><div class="ab-content">${a.html()}</div></div>`;
  world.appendChild(w); a.el=w;
});
/* valores reales de los tokens */
document.querySelectorAll('.hexv').forEach(el=>{ const ab=el.closest('.ab'); const v=getComputedStyle(ab).getPropertyValue(el.dataset.v).trim(); if(v&&!v.startsWith('radial')&&!v.startsWith('inset')) el.textContent=el.dataset.v+' · '+v; });
document.querySelectorAll('.sw[data-copy] i[style*="#"]').forEach(i=>{ const m=i.style.background; });

/* índice */
const nav=document.getElementById('nav'); let lastG='';
AB.forEach(a=>{ if(a.g!==lastG){ nav.insertAdjacentHTML('beforeend',`<h6>${a.g}</h6>`); lastG=a.g; } const l=document.createElement('a'); l.textContent=a.t; l.onclick=()=>focusAB(a); a.link=l; nav.appendChild(l); });

/* ================= Motor pan / zoom ================= */
let tx=0,ty=0,s=1; const zl=document.getElementById('zl');
const apply=()=>{ world.style.transform=`translate(${tx}px,${ty}px) scale(${s})`; vp.style.backgroundPosition=`${tx}px ${ty}px`; vp.style.backgroundSize=`${24*s}px ${24*s}px`; zl.textContent=Math.round(s*100)+'%'; };
const view=()=>({x:268,y:0,w:innerWidth-268,h:innerHeight});
function fitBox(x,y,w,h,pad=70){ const v=view(); s=Math.min((v.w-pad*2)/w,(v.h-pad*2)/h,1.4); tx=v.x+(v.w-w*s)/2-x*s; ty=v.y+(v.h-h*s)/2-y*s; apply(); }
function fitAll(){ const xs=Math.min(...AB.map(a=>a.x)), ys=Math.min(...AB.map(a=>a.y))-40, xe=Math.max(...AB.map(a=>a.x+a.w)), ye=Math.max(...AB.map(a=>a.y+a.h)); fitBox(xs,ys,xe-xs,ye-ys,40); AB.forEach(a=>a.link.classList.remove('on')); }
function focusAB(a){ fitBox(a.x,a.y-40,a.w,a.h+40); AB.forEach(b=>b.link.classList.toggle('on',b===a)); }
function zoomAt(f,cx,cy){ const ns=Math.min(4,Math.max(.04,s*f)); tx=cx-(cx-tx)*(ns/s); ty=cy-(cy-ty)*(ns/s); s=ns; apply(); }
vp.addEventListener('wheel',e=>{ e.preventDefault(); if(e.ctrlKey||e.metaKey){ zoomAt(Math.exp(-e.deltaY*0.01),e.clientX,e.clientY); } else { tx-=e.deltaX; ty-=e.deltaY; apply(); } },{passive:false});
let drag=null,moved=0;
vp.addEventListener('pointerdown',e=>{ if(e.target.closest('input,select,textarea')) return; drag={x:e.clientX,y:e.clientY,tx,ty}; moved=0; vp.classList.add('drag'); vp.setPointerCapture(e.pointerId); });
vp.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; moved=Math.max(moved,Math.abs(dx)+Math.abs(dy)); tx=drag.tx+dx; ty=drag.ty+dy; apply(); });
vp.addEventListener('pointerup',e=>{ drag=null; vp.classList.remove('drag'); });
document.getElementById('zi').onclick=()=>zoomAt(1.25,innerWidth/2+126,innerHeight/2);
document.getElementById('zo').onclick=()=>zoomAt(.8,innerWidth/2+126,innerHeight/2);
document.getElementById('zf').onclick=fitAll;
document.getElementById('zb').onclick=e=>{ const off=world.classList.toggle('nobg'); e.target.textContent='Fondos: '+(off?'no':'sí'); };
zl.onclick=()=>{ const f=1/s; zoomAt(f,innerWidth/2+126,innerHeight/2); };
addEventListener('keydown',e=>{ if(e.target.matches('input')) return; if(e.key==='0') fitAll(); if(e.key==='1') zl.click(); if(e.key==='+'||e.key==='=') document.getElementById('zi').click(); if(e.key==='-') document.getElementById('zo').click(); });
addEventListener('resize',apply);
/* copiar token */
const toast=document.getElementById('toast'); const say=t=>{ toast.textContent=t; toast.classList.add('on'); clearTimeout(say.t); say.t=setTimeout(()=>toast.classList.remove('on'),1400); };
vp.addEventListener('click',e=>{ if(moved>4) return; const c=e.target.closest('[data-copy]'); if(c){ navigator.clipboard?.writeText(c.dataset.copy).then(()=>say('Copiado: '+c.dataset.copy.slice(0,60))); return; } if(e.target.closest('[data-copy-all]')){ navigator.clipboard?.writeText(asRoot).then(()=>say('Tokens CSS copiados')); } });
document.querySelectorAll('[data-copy-all]').forEach(b=>b.addEventListener('click',()=>navigator.clipboard?.writeText(asRoot).then(()=>say('Tokens CSS copiados'))));
fitAll();
</script>
